name: 安装求助
description: 装不上、装完没反应、crop 命令找不到——按这个模板贴，最快定位
title: "[安装] "
labels: ["needs-triage", "install"]
body:
  - type: markdown
    attributes:
      value: |
        Agent Crop 只在本地观察：数据不出本机（`~/.agentcrop`）、不自动改代码、不评估人、不替代测试。
        安装步骤见 README 的「安装与卸载」；Claude Code 的装法见 `docs/INSTALL.md`。

        > ⚠️ 请不要贴任何凭证：token、API key、cookie、SSH key、代理账号密码，一条都不要贴。
        > 贴诊断信息之前先删掉：用户名、token、私有路径（把 `/Users/yourname/...` 换成 `/Users/<user>/...`）。

  - type: textarea
    id: stuck-at
    attributes:
      label: 安装卡在哪一步
      description: 说明是在哪一步停下的，以及那一步做了什么。贴之前删掉用户名、token、私有路径。
      placeholder: |
        例如：dsh plugin --profile dev add ~/agent-crop 跑完说 added，但重启后新会话里没有任何事件。
    validations:
      required: true

  - type: textarea
    id: install-command
    attributes:
      label: 用的哪条安装命令
      description: |
        把实际执行过的命令原样贴出来（README 现在是 `git clone` + `dsh plugin` 本地路径 add）。
        贴之前删掉用户名、token、私有路径。
      placeholder: |
        git clone https://github.com/oriliz/agent-crop.git ~/agent-crop
        dsh plugin --profile dev add ~/agent-crop
      render: shell
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: profile 名
      description: 你 add 到了哪个 profile（`dsh plugin --profile <name> add ...` 里的那个 name）。贴之前删掉用户名、token、私有路径。
      placeholder: dev
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: 报错原文
      description: 命令输出的原文，不要只写「报错了」。贴之前删掉用户名、token、私有路径。
      render: shell
    validations:
      required: true

  - type: textarea
    id: crop-status
    attributes:
      label: crop status 输出
      description: |
        运行 `crop status` 并把输出贴进来；如果连 `crop` 命令都找不到，就在这里写「command not found」，
        并说明 `crop` 有没有放进 PATH。贴之前删掉用户名、token、私有路径。
      placeholder: |
        Crop 状态 — unknown  2026-11-15 01:23
        当前任务块  空闲
        今日事件  0 条
        数据目录  <path>/data
      render: shell
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: 宿主版本（可选）
      description: 运行 `dsh --version` 粘贴输出。贴之前删掉用户名、token、私有路径。
      placeholder: 0.2.2-rc.3
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统与 node 版本（可选）
      description: 例如 macOS 15.3 / node v22.19.0；Python 相关的问题请一并写上 python3 --version。贴之前删掉用户名、token、私有路径。
      placeholder: macOS 15.3 · node v22.19.0 · python 3.12
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: 提交前确认
      options:
        - label: 我已经删掉了本次内容里的用户名、token 和私有路径
          required: true
        - label: 我贴的内容里不含任何凭证（token / API key / cookie / 私钥）
          required: true
