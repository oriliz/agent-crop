name: Release

# 只在 tag 上触发：PR 与分支 push 都不会进这里
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create
  id-token: write # npm Trusted Publishing (OIDC) + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag 与版本一致
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 校验 tag 与 package.json 版本
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          echo "tag=${tag}  version=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag 与 package.json 版本不一致（tag=${tag}, version=${version}）。先把 package.json 改成 ${tag} 并合并，再打 tag。"
            exit 1
          fi

  verify:
    name: 重跑三条测试
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: python3 -m unittest discover -s tests -t . -v
        run: python3 -m unittest discover -s tests -t . -v
      - name: node --test dsh/test/index.test.mjs
        run: node --test dsh/test/index.test.mjs
      - name: bash tests/probe-smoke.sh
        run: bash tests/probe-smoke.sh

  publish:
    name: npm publish --provenance
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 人工审批门：这个 environment 配了 required reviewers，
    # 没有维护者在 Actions 页面点 Approve，job 不会开始 —— 发布不能自动发生。
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/agent-crop-dsh
    steps:
      - uses: actions/checkout@v5
      # 可信发布（OIDC）：npm 用 Actions 的 id-token 换短期发布凭据，仓库里不存 NPM_TOKEN。
      # 三个硬性条件（错一个就报 ENEEDAUTH）：
      #   1. npm >= 11.5.1 → 用 Node 24；Node 22 自带 npm 10，不支持 OIDC
      #   2. 不设 registry-url：setup-node 会写 _authToken=${NODE_AUTH_TOKEN} 的 .npmrc，
      #      空 token 也会让 npm 优先走 token 认证，直接绕过 OIDC
      #   3. 不设 NODE_AUTH_TOKEN（含空串）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm 版本必须 >= 11.5.1（Trusted Publishing 要求）
        run: |
          npm_version=$(npm --version)
          major=${npm_version%%.*}
          minor=${npm_version#*.}
          minor=${minor%%.*}
          echo "npm ${npm_version}"
          if [ "${major}" -lt 11 ] || { [ "${major}" -eq 11 ] && [ "${minor}" -lt 5 ]; }; then
            echo "::error::npm ${npm_version} 不支持 Trusted Publishing，需要 >= 11.5.1。请用 Node 24 或先 npm install -g npm@^11.5.1。"
            exit 1
          fi
      - name: 该版本是否已发布
        id: state
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "agent-crop-dsh@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "agent-crop-dsh@${version} 已在 npm 上：本次跳过发布，只补 Release。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm pack --dry-run 自检
        run: npm pack --dry-run
      - name: npm publish --provenance --access public
        if: steps.state.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: 确保 GitHub Release 存在（幂等）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过创建。"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
