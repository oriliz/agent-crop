<text x="84" y="662" font-family="'Helvetica Neue','Arial',sans-serif" font-size="24" fill="#4b5563">Time-based analysis of one work block</text>
<text x="1516" y="612" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="20" fill="#6b7280">Focus on the critical path, streamline collaboration, raise agent throughput</text>

