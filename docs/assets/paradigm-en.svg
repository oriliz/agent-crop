<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1066" viewBox="0 0 1600 1066" role="img" aria-labelledby="p1 p2">
<title id="p1">Classic performance tuning vs. agent workflow tuning</title>
<desc id="p2">Top: a request's span waterfall, where the database query is the longest stretch. Bottom: where one work block's time went, where waiting for your answer is the longest stretch.</desc>
<rect width="1600" height="1066" fill="#f3f4f8"/>

<!-- card 1 -->
<rect x="44" y="44" width="1512" height="458" rx="16" fill="#fbfbfb" stroke="#e9eaee" stroke-width="1.5"/>
<text x="84" y="126" font-family="'Helvetica Neue','Arial',sans-serif" font-size="44" font-weight="700" fill="#0e1629">Classic performance tuning</text>
<text x="84" y="168" font-family="'Helvetica Neue','Arial',sans-serif" font-size="24" fill="#4b5563">Time-based analysis of a request</text>
<text x="1516" y="118" text-anchor="end" font-family="'Helvetica Neue','Arial',sans-serif" font-size="20" fill="#6b7280">Identify bottlenecks, optimize precisely, improve overall performance</text>

