<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530" role="img" aria-labelledby="t1 t2">
<title id="t1">一次对话里的探针：轮结束、下一句、提问等待与鞭策</title>
<desc id="t2">起点是会话开始。上方是采集，下方是注入。时间条蓝色是活跃，黄色是你这边的时间，都不算活跃。</desc>
<rect width="1400" height="530" rx="18" fill="#ffffff"/>
<rect x="0.8" y="0.8" width="1398.4" height="528.4" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
<rect x="42" y="34" width="16" height="16" rx="4" fill="#3b6bb0"/>
<text x="66" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">活跃：AI 在干</text>
<rect x="206" y="34" width="16" height="16" rx="4" fill="#c8912f"/>
<text x="230" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">等待：你回答 / 想下一句，不算活跃</text>
<rect x="760" y="34.5" width="15" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="784" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">虚线：只在发生时才记 / 只在那时注入</text>
<line x1="140" y1="250" x2="1342" y2="250" stroke="#cbd5e1" stroke-width="3"/>
<path d="M 1342 241 L 1364 250 L 1342 259 Z" fill="#cbd5e1"/>
<text x="1364" y="240" text-anchor="end" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">时间 →</text>
<circle cx="140" cy="250" r="10" fill="#0f172a"/>
<text x="140" y="226" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#0f172a">会话开始</text>
<path d="M 520 239 L 531 250 L 520 261 L 509 250 Z" fill="#0f172a"/>
<text x="520" y="278" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">一轮结束</text>
<circle cx="620" cy="250" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="620" y="278" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">你发下一句</text>
<rect x="140" y="330" width="380" height="14" rx="7" fill="#3b6bb0" opacity="0.85"/>
<rect x="520" y="330" width="100" height="14" fill="#c8912f" opacity="0.9"/>
<rect x="620" y="330" width="180" height="14" fill="#3b6bb0" opacity="0.85"/>
<rect x="800" y="330" width="200" height="14" fill="#c8912f" opacity="0.9"/>
<rect x="1000" y="330" width="300" height="14" rx="7" fill="#3b6bb0" opacity="0.85"/>
<text x="160" y="370" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">活跃计时</text>
<text x="900" y="370" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#c8912f">人类回答时间 · 不计入活跃</text>
<line x1="360" y1="222" x2="360" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="360" cy="250" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="280.0" y="166" width="160.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="360" y="202" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">记工具与失败</text>
<line x1="520" y1="222" x2="520" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<rect x="450.0" y="166" width="140.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="520" y="202" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">记这轮时长</text>
<line x1="620" y1="148" x2="620" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<rect x="570.0" y="92" width="100.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="620" y="128" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">记等待</text>
<line x1="735" y1="222" x2="735" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="735" cy="250" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="665.0" y="166" width="140.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="735" y="202" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">记返工信号</text>
<line x1="800" y1="148" x2="800" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="800" cy="250" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="730.0" y="92" width="140.0" height="56" rx="14" fill="#ffffff" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="800" y="128" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="0.85">记提问时点</text>
<line x1="1000" y1="148" x2="1000" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1000" cy="250" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="930.0" y="92" width="140.0" height="56" rx="14" fill="#ffffff" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1000" y="128" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="0.85">记回答时点</text>
<line x1="1090" y1="222" x2="1090" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1090" cy="250" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="1040.0" y="166" width="100.0" height="56" rx="14" fill="#ffffff" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1090" y="202" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="0.85">记超时</text>
<line x1="1215" y1="222" x2="1215" y2="240" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1215" cy="250" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="1155.0" y="166" width="120.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="1215" y="202" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">收工总结</text>
<line x1="250" y1="260" x2="250" y2="392" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="250" cy="250" r="5" fill="#ffffff" stroke="#c8912f" stroke-width="2"/>
<rect x="180.0" y="392" width="140.0" height="56" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="250" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c8912f" opacity="1">认领并绑定</text>
<line x1="620" y1="260" x2="620" y2="392" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="620" cy="250" r="5" fill="#ffffff" stroke="#c8912f" stroke-width="2"/>
<rect x="550.0" y="392" width="140.0" height="56" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="620" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c8912f" opacity="1">提示后注入</text>
<line x1="1090" y1="260" x2="1090" y2="392" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1090" cy="250" r="5" fill="#ffffff" stroke="#c8912f" stroke-width="2"/>
<rect x="1050.0" y="392" width="80.0" height="56" rx="14" fill="#ffffff" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1090" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c8912f" opacity="0.85">鞭策</text>
<text x="140" y="505" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">离开超过 15 分钟（或不在工作时段）单独记，既不算活跃也不算等待</text>
</svg>