<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="t1 t2">
<title id="t1">一次对话里的探针：两轮之间、时点与注入</title>
<desc id="t2">起点是会话开始。上方是采集，下方是注入；中间竖向虚线把上一轮和下一轮分开。底部时间条蓝色是活跃，黄色是你这边的时间。</desc>
