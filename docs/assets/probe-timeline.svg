<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t1 t2">
<title id="t1">一次对话：探针在哪采集，在哪推 AI 一把</title>
<desc id="t2">横向时间线。上方是自动采集，下方是注入给 AI 的一句话；虚线表示只在特定条件下触发。</desc>
<rect width="1400" height="560" rx="18" fill="#ffffff"/>
<rect x="0.8" y="0.8" width="1398.4" height="558.4" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
<rect x="42" y="36" width="16" height="16" rx="4" fill="#1d4ed8"/>
<text x="66" y="52" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">采集：自动记</text>
<rect x="196" y="36" width="16" height="16" rx="4" fill="#b45309"/>
<text x="220" y="52" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">影响：注入一句</text>
<rect x="372" y="36.5" width="15" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="396" y="52" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">虚线 = 条件触发，不是每次</text>
<line x1="90" y1="300" x2="1342" y2="300" stroke="#cbd5e1" stroke-width="3"/>
<path d="M 1342 291 L 1364 300 L 1342 309 Z" fill="#cbd5e1"/>
<text x="1360" y="334" text-anchor="end" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">时间</text>
<line x1="170" y1="156" x2="170" y2="292" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="170" cy="300" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="110.0" y="96" width="120.0" height="60" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="170" y="134" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d4ed8" opacity="1">开始计时</text>
<line x1="300" y1="308" x2="300" y2="454" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="300" cy="300" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="220.0" y="454" width="160.0" height="60" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="300" y="492" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#b45309" opacity="1">先认领或跳过</text>
<line x1="455" y1="308" x2="455" y2="378" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="455" cy="300" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="375.0" y="378" width="160.0" height="60" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="455" y="416" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#b45309" opacity="1">每轮一句状态</text>
<line x1="545" y1="156" x2="545" y2="292" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="545" cy="300" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="495.0" y="96" width="100.0" height="60" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="545" y="134" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d4ed8" opacity="1">记工具</text>
<line x1="640" y1="308" x2="640" y2="454" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="640" cy="300" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="560.0" y="454" width="160.0" height="60" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="640" y="492" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#b45309" opacity="0.85">没认领就提醒</text>
<line x1="780" y1="232" x2="780" y2="292" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="780" cy="300" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="730.0" y="172" width="100.0" height="60" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="780" y="210" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d4ed8" opacity="0.85">记等待</text>
<line x1="935" y1="156" x2="935" y2="292" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="935" cy="300" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="885.0" y="96" width="100.0" height="60" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="935" y="134" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d4ed8" opacity="0.85">记提醒</text>
<line x1="935" y1="308" x2="935" y2="378" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="935" cy="300" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="885.0" y="378" width="100.0" height="60" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="935" y="416" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#b45309" opacity="0.85">到点催</text>
<line x1="1105" y1="156" x2="1105" y2="292" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1105" cy="300" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="1055.0" y="96" width="100.0" height="60" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="1105" y="134" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d4ed8" opacity="1">记时长</text>
<line x1="1245" y1="232" x2="1245" y2="292" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1245" cy="300" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="1175.0" y="172" width="140.0" height="60" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1245" y="210" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d4ed8" opacity="0.85">收工三句话</text>
</svg>