<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="524" viewBox="0 0 1400 524" role="img" aria-labelledby="t1 t2">
<title id="t1">一次对话里的探针：采集、注入、等待与鞭策</title>
<desc id="t2">起点是会话开始。上方是采集，下方是注入。底部时间条蓝色是 AI 活跃，黄色是你回答的等待，不算活跃。</desc>
<rect width="1400" height="524" rx="18" fill="#ffffff"/>
<rect x="0.8" y="0.8" width="1398.4" height="522.4" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
<rect x="42" y="34" width="16" height="16" rx="4" fill="#3b6bb0"/>
<text x="66" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">活跃：AI 在干</text>
<rect x="206" y="34" width="16" height="16" rx="4" fill="#c8912f"/>
<text x="230" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">等待：你回答 / 想下一句，不算活跃</text>
<rect x="792" y="34.5" width="15" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="816" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">虚线：只在发生时才记 / 只在那时注入</text>
<line x1="140" y1="270" x2="1342" y2="270" stroke="#cbd5e1" stroke-width="3"/>
<path d="M 1342 261 L 1364 270 L 1342 279 Z" fill="#cbd5e1"/>
<text x="1364" y="260" text-anchor="end" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">时间 →</text>
<circle cx="140" cy="270" r="10" fill="#0f172a"/>
<text x="140" y="246" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#0f172a">会话开始</text>
<line x1="520" y1="248" x2="520" y2="292" stroke="#0f172a" stroke-width="2"/>
<text x="520" y="230" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">一轮结束</text>
<text x="520" y="252" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">你发下一句</text>
<rect x="140" y="312" width="380" height="14" rx="7" fill="#3b6bb0" opacity="0.85"/>
<rect x="520" y="312" width="70" height="14" fill="#c8912f" opacity="0.9"/>
<rect x="590" y="312" width="190" height="14" fill="#3b6bb0" opacity="0.85"/>
<rect x="780" y="312" width="200" height="14" fill="#c8912f" opacity="0.9"/>
<rect x="980" y="312" width="320" height="14" rx="7" fill="#3b6bb0" opacity="0.85"/>
<text x="160" y="352" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">活跃计时</text>
<text x="880" y="352" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#c8912f">人类回答时间 · 不计入活跃</text>
<line x1="380" y1="224" x2="380" y2="260" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="380" cy="270" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="300.0" y="168" width="160.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="380" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">记工具与失败</text>
<line x1="690" y1="224" x2="690" y2="260" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="690" cy="270" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="620.0" y="168" width="140.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="690" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">记返工信号</text>
<line x1="780" y1="152" x2="780" y2="260" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="780" cy="270" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="710.0" y="96" width="140.0" height="56" rx="14" fill="#ffffff" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="780" y="132" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="0.85">记提问时点</text>
<line x1="980" y1="152" x2="980" y2="260" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="980" cy="270" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="910.0" y="96" width="140.0" height="56" rx="14" fill="#ffffff" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="980" y="132" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="0.85">记回答时点</text>
<line x1="1080" y1="224" x2="1080" y2="260" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1080" cy="270" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="1030.0" y="168" width="100.0" height="56" rx="14" fill="#ffffff" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1080" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="0.85">记超时</text>
<line x1="1210" y1="224" x2="1210" y2="260" stroke="#3b6bb0" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1210" cy="270" r="5" fill="#ffffff" stroke="#3b6bb0" stroke-width="2"/>
<rect x="1150.0" y="168" width="120.0" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="1210" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#3b6bb0" opacity="1">收工总结</text>
<line x1="250" y1="280" x2="250" y2="392" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="250" cy="270" r="5" fill="#ffffff" stroke="#c8912f" stroke-width="2"/>
<rect x="180.0" y="392" width="140.0" height="56" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="250" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c8912f" opacity="1">认领并绑定</text>
<line x1="600" y1="280" x2="600" y2="392" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="600" cy="270" r="5" fill="#ffffff" stroke="#c8912f" stroke-width="2"/>
<rect x="530.0" y="392" width="140.0" height="56" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="600" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c8912f" opacity="1">提示后注入</text>
<line x1="1080" y1="280" x2="1080" y2="392" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.45"/>
<circle cx="1080" cy="270" r="5" fill="#ffffff" stroke="#c8912f" stroke-width="2"/>
<rect x="1040.0" y="392" width="80.0" height="56" rx="14" fill="#ffffff" stroke="#c8912f" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1080" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c8912f" opacity="0.85">鞭策</text>
<line x1="780" y1="326" x2="780" y2="334" stroke="#c8912f" stroke-width="2"/>
<line x1="980" y1="326" x2="980" y2="334" stroke="#c8912f" stroke-width="2"/>
<text x="140" y="500" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">离开超过 15 分钟（或不在工作时段）单独记，既不算活跃也不算等待</text>
</svg>