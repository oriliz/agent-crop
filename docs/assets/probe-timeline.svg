<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="t1 t2">
<title id="t1">一次对话：探针在哪采集，在哪推 AI 一把</title>
<desc id="t2">横向时间线。上方是探针自动记下的东西，下方是它给 AI 注入的一句话。</desc>
<rect width="1400" height="540" rx="18" fill="#ffffff"/>
<rect x="0.8" y="0.8" width="1398.4" height="538.4" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
<rect x="42" y="36" width="16" height="16" rx="4" fill="#1d4ed8"/>
<text x="66" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748b">采集：探针自动记，不打扰 AI</text>
<rect x="404" y="36" width="16" height="16" rx="4" fill="#b45309"/>
<text x="428" y="50" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748b">影响：注入一句，改变它下一步</text>
<line x1="90" y1="330" x2="1342" y2="330" stroke="#cbd5e1" stroke-width="3"/>
<path d="M 1342 321 L 1364 330 L 1342 339 Z" fill="#cbd5e1"/>
<text x="1360" y="364" text-anchor="end" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">时间</text>
<rect x="138.0" y="315" width="64.0" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="170" y="337" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#0f172a">开场</text>
<line x1="170" y1="158" x2="170" y2="312" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="106.0" y="96" width="128.0" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="170" y="135" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">开始计时</text>
<line x1="170" y1="348" x2="170" y2="430" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="116.5" y="430" width="107.0" height="62" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="170" y="469" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#b45309">先认领</text>
<rect x="348.0" y="315" width="64.0" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="380" y="337" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#0f172a">干活</text>
<line x1="380" y1="238" x2="380" y2="312" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="326.5" y="176" width="107.0" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="380" y="215" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">记目标</text>
<line x1="380" y1="348" x2="380" y2="430" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="316.0" y="430" width="128.0" height="62" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="380" y="469" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#b45309">接着上次</text>
<rect x="548.5" y="315" width="83.0" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="590" y="337" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#0f172a">每一步</text>
<line x1="590" y1="158" x2="590" y2="312" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="536.5" y="96" width="107.0" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="590" y="135" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">记工具</text>
<line x1="590" y1="348" x2="590" y2="430" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="505.0" y="430" width="170.0" height="62" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="590" y="469" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#b45309">没认领就提醒</text>
<rect x="758.5" y="315" width="83.0" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="800" y="337" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#0f172a">等回话</text>
<line x1="800" y1="238" x2="800" y2="312" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="746.5" y="176" width="107.0" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="800" y="215" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">记等待</text>
<line x1="800" y1="348" x2="800" y2="430" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="736.0" y="430" width="128.0" height="62" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="800" y="469" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#b45309">问清一次</text>
<rect x="978.0" y="315" width="64.0" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1010" y="337" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#0f172a">超时</text>
<line x1="1010" y1="158" x2="1010" y2="312" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="956.5" y="96" width="107.0" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="1010" y="135" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">记提醒</text>
<line x1="1010" y1="348" x2="1010" y2="430" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="935.5" y="430" width="149.0" height="62" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="1010" y="469" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#b45309">催它说卡点</text>
<rect x="1188.0" y="315" width="64.0" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1220" y="337" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#0f172a">收尾</text>
<line x1="1220" y1="238" x2="1220" y2="312" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="1166.5" y="176" width="107.0" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="1220" y="215" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">记时长</text>
<line x1="1220" y1="348" x2="1220" y2="430" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<rect x="1145.5" y="430" width="149.0" height="62" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="1220" y="469" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#b45309">留一句复盘</text>
</svg>